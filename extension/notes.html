<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Azimut notes</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="notes">
  <div id="bar" class="bar" hidden>
    <!-- asked once, when the note's Add needs a page the browser keeps from the extension -->
    <div id="allowing" class="allowing" hidden>
      <p>Let Azimut read the page you add from. It reads a page only when you add from it.</p>
      <button id="allow" title="The browser asks you once; the extension's options take it back">Allow</button>
    </div>
    <p id="status" class="status" hidden></p>
  </div>
  <section id="down" class="down" hidden>
    <p id="down-text"></p>
    <button id="retry">Try again</button>
  </section>
  <iframe id="note" title="Note" allow="clipboard-write"></iframe>
  <script src="notesmsg.js"></script>
  <script src="notes.js"></script>
</body>
</html>
