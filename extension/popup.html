<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="popup">
  <header>
    <img src="icons/icon32.png" alt="" width="18" height="18" />
    <strong>Azimut Capture</strong>
  </header>

  <!-- on Azimut's own tab: opening this popup is what lets the app capture it -->
  <p id="granted" class="muted" hidden>Azimut may now capture this tab.</p>

  <section id="pairing" hidden>
    <h1>Pair with Azimut</h1>
    <ol class="steps">
      <li>
        In Azimut, open <strong>Settings › Capture extension</strong>.
        <button id="open-settings" class="link" hidden>Open it</button>
      </li>
      <li>Copy the pairing token.</li>
      <li>Paste it here.</li>
    </ol>
    <div class="row pair">
      <input id="token" type="password" placeholder="Pairing token" autocomplete="off" />
      <button id="pair" class="primary">Pair</button>
    </div>
    <details id="elsewhere">
      <summary>Azimut on another address?</summary>
      <div class="row">
        <input id="backendUrl" type="text" placeholder="http://127.0.0.1:8477" />
      </div>
    </details>
  </section>

  <!-- under the form while pairing, over the next step once paired -->
  <p id="status" class="status" hidden></p>

  <section id="paired" hidden>
    <div class="actions stacked">
      <button id="next" class="primary" hidden></button>
    </div>
  </section>

  <script src="pairing.js"></script>
  <script src="mapsites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
