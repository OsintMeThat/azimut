<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="options">
  <h1>Pair with Azimut</h1>
  <p class="muted">
    Paste the token from <strong>Settings → Capture extension</strong> to pair
    this extension with the local app.
  </p>
  <div class="row">
    <label for="backendUrl">Azimut URL</label>
    <input id="backendUrl" type="text" placeholder="http://127.0.0.1:8477" />
  </div>
  <div class="row">
    <label for="token">Pairing token</label>
    <input id="token" type="password" placeholder="paste from Azimut Settings" />
  </div>
  <div class="actions">
    <button id="save" class="primary">Save &amp; test</button>
  </div>
  <p id="status" class="status" hidden></p>
  <section id="pages" hidden>
    <h2>Adding from a page</h2>
    <p class="muted" id="pages-said"></p>
    <div class="actions">
      <button id="pages-revoke">Take it back</button>
    </div>
  </section>
  <script src="options.js"></script>
</body>
</html>
