name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so the "latest deps" tripwire below reports upstream breakage even
  # in quiet weeks — bit rot doesn't wait for us to push.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The three OSes we ship binaries for, plus the floor and ceiling of the
        # Python range pyproject claims. Testing one Linux/3.12 box and shipping a
        # Windows exe was a guess; this is what makes "works everywhere" checkable.
        # Filesystem behaviour is where they actually differ — engine/scrapers.py
        # swaps directories, and Windows won't delete an open file.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"  # the floor in requires-python
          - os: ubuntu-latest
            python: "3.13"  # the ceiling we've tested against
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: ${{ matrix.python }}
      # --frozen installs uv.lock exactly and never re-resolves, so a green run
      # means "these versions work", not "whatever PyPI served this morning".
      # --check fails if uv.lock drifted from pyproject.toml (forgot `uv lock`).
      - run: uv lock --check
      - run: uv sync --frozen --extra dev
      - name: Run backend suite
        if: runner.os != 'Windows'
        run: uv run pytest -q --durations=20 --durations-min=1
      # Windows is the slowest box. Naming every test keeps a genuine stall
      # diagnosable instead of leaving one silent pytest process for hours.
      - name: Run backend suite with per-test progress
        if: runner.os == 'Windows'
        run: uv run pytest -vv --durations=20 --durations-min=1

  lint:
    name: Lint & type-check (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One box, not the OS/version matrix: ruff and mypy read the same source
    # everywhere, so five runs would just be five identical verdicts. Python
    # 3.12 on purpose — mypy parses numpy's 2.x stubs, which use 3.12 syntax a
    # 3.11 target chokes on. The 3.11 floor stays covered by the pytest matrix.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run mypy

  backend-floating:
    name: Backend tests (latest deps)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The lock is the safety net; this is the tripwire. It re-resolves everything
    # to the newest versions our ranges allow, so an upstream release that breaks
    # us surfaces here — on a scheduled run we triage — instead of in a user's
    # `pip install azimut`. Advisory: a red run never blocks a merge.
    if: github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --upgrade --extra dev
      - run: uv run pytest -q --durations=20 --durations-min=1

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx vitest run
      - run: npm run build

  browser:
    name: Browser canvas interactions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
