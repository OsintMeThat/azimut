name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so the "latest deps" tripwire below reports upstream breakage even
  # in quiet weeks — bit rot doesn't wait for us to push.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The three OSes we ship binaries for, plus the floor and ceiling of the
        # Python range pyproject claims. Testing one Linux/3.12 box and shipping a
        # Windows exe was a guess; this is what makes "works everywhere" checkable.
        # Filesystem behaviour is where they actually differ — engine/scrapers.py
        # swaps directories, and Windows won't delete an open file.
        #
        # `tests` is what each box runs. Everywhere but Windows that is the whole
        # suite in one job, because -n auto finishes it in about three minutes.
        # Windows pays roughly eight times as much per test — every one of these
        # builds a case, and a case is a database, folders and files — so it is the
        # one box that runs the suite in pieces, and the pieces are cut on measured
        # cost rather than on the alphabet. Neither signal predicts Windows alone:
        # by CPU seconds the heaviest range finished first, by test count the
        # lightest finished last, so the weight is both, and the six ranges each
        # carry 14-18% of it against the 11/19/11/21/38 the old five ran.
        #
        # The ranges have to leave no gap: one stopping at test_sc* beside one
        # starting at test_se* runs everything except the test_sd* somebody adds
        # next year, and says nothing. `tests/test_ci_shards.py` reads them back
        # out of this file and fails if they stop covering the directory.
        include:
          - name: Backend (ubuntu-latest, py3.12)
            os: ubuntu-latest
            python: "3.12"
            tests: tests
          - name: Backend (macos-latest, py3.12)
            os: macos-latest
            python: "3.12"
            tests: tests
          - name: Backend (windows-latest, py3.12, 1/6)
            os: windows-latest
            python: "3.12"
            tests: tests/test_[a-d]*.py tests/test_e[a-n]*.py
          - name: Backend (windows-latest, py3.12, 2/6)
            os: windows-latest
            python: "3.12"
            tests: tests/test_e[o-z]*.py tests/test_[f-i]*.py
          - name: Backend (windows-latest, py3.12, 3/6)
            os: windows-latest
            python: "3.12"
            tests: tests/test_[j-o]*.py tests/test_p[a-l]*.py
          - name: Backend (windows-latest, py3.12, 4/6)
            os: windows-latest
            python: "3.12"
            tests: tests/test_p[m-z]*.py tests/test_[q-r]*.py tests/test_s[a-d]*.py
          - name: Backend (windows-latest, py3.12, 5/6)
            os: windows-latest
            python: "3.12"
            tests: tests/test_s[e-h]*.py
          - name: Backend (windows-latest, py3.12, 6/6)
            os: windows-latest
            python: "3.12"
            tests: tests/test_s[i-z]*.py tests/test_[t-z]*.py
          - name: Backend (ubuntu-latest, py3.11)
            os: ubuntu-latest
            python: "3.11"  # the floor in requires-python
            tests: tests
          - name: Backend (ubuntu-latest, py3.13)
            os: ubuntu-latest
            python: "3.13"  # the ceiling we've tested against
            tests: tests
    steps:
      - uses: actions/checkout@v7
      # Defender reads every file as it is written, and this suite writes a whole
      # case per test. Excluding the three directories the run works in is the
      # difference between a Windows job that fits the timeout and one that does
      # not. Best-effort: a runner that refuses the call is slow, not broken.
      - name: Keep Defender out of the directories the suite writes
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $env:TEMP, $env:GITHUB_WORKSPACE
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: ${{ matrix.python }}
      # --frozen installs uv.lock exactly and never re-resolves, so a green run
      # means "these versions work", not "whatever PyPI served this morning".
      # --check fails if uv.lock drifted from pyproject.toml (forgot `uv lock`).
      - run: uv lock --check
      - run: uv sync --frozen --extra dev
      # -n auto spreads the work over the runner's cores. Every test builds its
      # case under `tmp_path` (see tests/conftest.py) and nothing is scoped wider
      # than a test, so there is nothing for two workers to collide over. bash on
      # every OS so the Windows ranges glob the same way they do here.
      - name: Run backend suite
        shell: bash
        run: uv run pytest -q -n auto ${{ matrix.tests }} --durations=20 --durations-min=1

  lint:
    name: Lint & type-check (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One box, not the OS/version matrix: ruff and mypy read the same source
    # everywhere, so matrix runs would just be identical verdicts. Python
    # 3.12 on purpose — mypy parses numpy's 2.x stubs, which use 3.12 syntax a
    # 3.11 target chokes on. The 3.11 floor stays covered by the pytest matrix.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run mypy

  backend-floating:
    name: Backend tests (latest deps)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The lock is the safety net; this is the tripwire. It re-resolves everything
    # to the newest versions our ranges allow, so an upstream release that breaks
    # us surfaces here — on a scheduled run we triage — instead of in a user's
    # `pip install azimut`. Advisory: a red run never blocks a merge.
    if: github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --upgrade --extra dev
      - run: uv run pytest -q -n auto --durations=20 --durations-min=1

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx vitest run
      - run: npm run build

  browser:
    name: Browser canvas interactions (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One job per browser rather than one job running both. The specs stay at a
    # single Playwright worker on purpose — canvas startup times out when Leaflet
    # and Konva compete for a runner's cores — so the only way to shorten this
    # job is to stop making Firefox wait for Chromium. Each job also installs
    # only the browser it runs.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
