name: Release

# Cut a release by pushing a semver tag, e.g.  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Version + release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.12"
      # Install the app (editable) + dev tools, like the CI backend job, so the
      # gate can import azimut and run its tests. No frontend build: these tests
      # don't touch the built UI, and the app tolerates a missing static dir.
      - run: uv sync --frozen --extra dev
      # The pushed tag must equal the version baked into the code. When it
      # didn't (0.2.2 shipped a stale __version__), the binary's self-update
      # check nagged every user about the very release they were running. This
      # is the check the release used to lack — it runs before anything builds.
      - name: Tag matches the code version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(uv run --no-sync python -c 'import azimut; print(azimut.__version__)')"
          echo "tag=$tag  __version__=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag != __version__ $ver — bump src/azimut/__init__.py"; exit 1; }
      # The version-parity gate the release workflow used to skip: pyproject's
      # version stays single-sourced, and the capture extension's own version
      # moves when the extension does and only then.
      - name: Release gate + version parity
        run: uv run --no-sync pytest tests/test_release_gate.py tests/test_updates.py -q

  dist:
    name: Build wheel + sdist
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.12"
      - name: Build frontend into the package
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build sdist + wheel
        run: |
          uv sync --frozen --no-dev --group release --no-install-project
          uv run --no-sync python -m build --no-isolation
      - name: Sanity-check the wheel bundles the UI and PDF assets
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          names = set(zipfile.ZipFile(whl).namelist())
          static = [name for name in names if name.startswith("azimut/static/")]
          assert static, "wheel is missing azimut/static/** — did the frontend build run?"
          required = {
              "azimut/assets/fonts/NotoSerif-Regular.ttf",
              "azimut/assets/fonts/APACHE-2.0.txt",
              "azimut/assets/fonts/OFL.txt",
              "azimut/assets/fonts/BITSTREAM-VERA.txt",
              "azimut/assets/fonts/README.md",
          }
          missing = sorted(required - names)
          assert not missing, f"wheel is missing PDF font assets: {missing}"
          print(f"{whl}: {len(static)} static files and PDF font assets bundled")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  binaries:
    name: Binary (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: azimut-linux-x86_64
            ffmpeg_target: linux-x86_64
          - os: windows-latest
            asset: azimut-windows-x86_64.exe
            ffmpeg_target: windows-x86_64
          - os: macos-latest
            asset: azimut-macos-arm64
            ffmpeg_target: macos-arm64
          # macos-latest is Apple Silicon. Intel remains a documented Python
          # package install rather than a standalone release asset.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.12"
      - name: Build frontend into the package
        working-directory: frontend
        run: npm ci && npm run build
      # The wheel only declares its dependencies, but the binary contains them.
      # Application and release tooling both come from the same lock.
      - name: Install locked application and release tooling
        run: |
          uv sync --frozen --no-dev --group release --no-install-project
          uv sync --frozen --no-dev --group release --no-build-isolation --no-editable
      # ffmpeg is a native program, not a Python dep. The helper pins and hashes
      # each upstream archive, then extracts only the expected tools.
      - name: Vendor static ffmpeg + ffprobe into the binary
        run: >-
          uv run --no-sync python scripts/vendor_ffmpeg.py
          "${{ matrix.ffmpeg_target }}"
          --output packaging/vendor
      - name: Build single-file binary
        run: uv run --no-sync pyinstaller packaging/azimut.spec --distpath dist-bin --workpath build-bin
      - name: Smoke-test the binary
        shell: bash
        run: |
          BIN=dist-bin/azimut
          [ "${{ runner.os }}" = "Windows" ] && BIN=dist-bin/azimut.exe
          uv run --no-sync python scripts/smoke_binary.py "$BIN"
      - name: Name the asset per-OS
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist-bin/azimut.exe "dist-bin/${{ matrix.asset }}"
          else
            mv dist-bin/azimut "dist-bin/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist-bin/${{ matrix.asset }}
          if-no-files-found: error

  artifacts:
    name: Assemble release artifacts
    needs: [dist, binaries]
    runs-on: ubuntu-latest
    steps:
      # This also exercises the upload/download pair on manual branch runs,
      # before a tag can reach GitHub Releases or PyPI.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Verify the complete release set
        shell: bash
        run: |
          test "$(find artifacts/dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find artifacts/dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test -s artifacts/azimut-linux-x86_64/azimut-linux-x86_64
          test -s artifacts/azimut-windows-x86_64.exe/azimut-windows-x86_64.exe
          test -s artifacts/azimut-macos-arm64/azimut-macos-arm64

  release:
    name: GitHub release + PyPI publish
    needs: artifacts
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # create the GitHub release + upload assets
      id-token: write   # PyPI Trusted Publishing (OIDC) — no token secret needed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Gather release assets (binaries + wheel/sdist)
        run: |
          mkdir -p upload
          find artifacts -type f -exec cp {} upload/ \;
          ls -l upload
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: upload/*
          body_path: docs/RELEASE_NOTES.md
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: artifacts/dist
