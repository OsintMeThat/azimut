name: CLA

# Asks every pull request author to sign CLA.md once, by posting a fixed
# comment, and records the signature on the unprotected `cla-signatures`
# branch. The check it reports is what keeps an unsigned contribution out of
# main once branch protection requires it.
#
# pull_request_target runs with a write token on pull requests from forks, so
# this workflow never checks out or runs the pull request's code. The action is
# pinned by commit for the same reason.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the Azimut CLA and I hereby sign it.'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/OsintMeThat/azimut/blob/main/CLA.md
          branch: cla-signatures
          allowlist: OsintMeThat,dependabot[bot]
          custom-pr-sign-comment: I have read the Azimut CLA and I hereby sign it.
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/OsintMeThat/azimut/blob/main/CLA.md)
            and sign it by posting the comment below. You only do this once.
          custom-allsigned-prcomment: Every author has signed the CLA.
          lock-pullrequest-aftermerge: false
